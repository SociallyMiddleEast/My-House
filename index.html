<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview — Home Control</title>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('hc_settings_v1')||'{}');var t=s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="overview">
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar" id="topbar-mount"></div>

    <div class="page-head">
      <div>
        <h1>Overview</h1>
        <div class="sub" id="ov-clock">—</div>
      </div>
      <div class="page-actions">
        <a class="btn small" href="connections.html"><svg><use href="#i-gear"/></svg>Connections</a>
      </div>
    </div>

    <div id="ov-demo-callout" class="callout hidden" style="margin-bottom:22px">
      Running on <strong>demo data</strong>. Head to <a href="connections.html">Connections</a> to point this at your real DeyeCloud, Tuya, LG ThinQ, or SmartThings accounts.
    </div>

    <div class="hero-grid">

      <a href="energy.html" class="panel" style="text-decoration:none; display:block; border-top:2px solid var(--amber);">
        <div style="display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:13px; margin-bottom:14px;">
          <svg style="width:15px;height:15px;color:var(--amber)"><use href="#i-bolt"/></svg>
          Energy management
        </div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <span style="font-family:var(--font-display); font-size:44px; font-weight:600;" id="ov-pv">—</span>
          <span class="muted" style="font-size:14px;">kW solar now</span>
        </div>
        <div style="display:flex; gap:18px; margin-top:16px; font-size:13px;">
          <div><span class="muted">Battery</span><br><strong id="ov-soc">—</strong></div>
          <div><span class="muted">Grid</span><br><strong id="ov-grid">—</strong></div>
          <div><span class="muted">Today</span><br><strong id="ov-today">—</strong></div>
        </div>
      </a>

      <a href="house-control.html" class="panel" style="text-decoration:none; display:block; border-top:2px solid var(--teal);">
        <div style="display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:13px; margin-bottom:14px;">
          <svg style="width:15px;height:15px;color:var(--teal)"><use href="#i-house"/></svg>
          House control
        </div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <span style="font-family:var(--font-display); font-size:44px; font-weight:600;" id="ov-devices-on">—</span>
          <span class="muted" style="font-size:14px;">of <span id="ov-devices-total">—</span> devices on</span>
        </div>
        <div style="display:flex; gap:18px; margin-top:16px; font-size:13px;">
          <div><span class="muted">First floor</span><br><strong id="ov-floor1">—</strong></div>
          <div><span class="muted">Second floor</span><br><strong id="ov-floor2">—</strong></div>
        </div>
      </a>

    </div>

    <div class="section-title">Home conditions</div>
    <div class="device-grid" id="climate-mount"></div>

    <div class="section-title">Connections</div>
    <div class="panel" style="display:flex; flex-wrap:wrap; gap:8px;" id="ov-platform-badges"></div>

  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/devices.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/overview.js"></script>
</body>
</html>
