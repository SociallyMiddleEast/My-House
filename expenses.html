<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses — Home Control</title>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('hc_settings_v1')||'{}');var t=s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}try{var a=JSON.parse(localStorage.getItem('hc_auth_v1')||'null');if(a&&a.enabled){var ok=sessionStorage.getItem('hc_session_ok')||localStorage.getItem('hc_session_ok');if(ok!=='1'){document.documentElement.setAttribute('data-authgate','locked');}}}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-page="expenses">
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar" id="topbar-mount"></div>

    <div class="page-head">
      <div>
        <h1>Expenses</h1>
        <div class="sub" id="exp-sub">—</div>
      </div>
      <div class="page-actions">
        <button class="btn small primary" id="exp-add-btn" style="background:var(--indigo); border-color:var(--indigo); color:#0E1330;">
          <svg><use href="#i-check"/></svg>Add expense
        </button>
      </div>
    </div>

    <div class="callout" style="border-left-color:var(--indigo); margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <span>Lives in this browser by default, same as Pantry. Connect Google Sheets in <a href="settings.html" style="color:var(--indigo);">Settings</a> to share it across devices.</span>
      <span id="sh-status" class="status-pill hidden"></span>
    </div>

    <div id="expense-form-panel" class="panel hidden" style="margin-bottom:20px;">
      <div class="section-title" id="ef-title" style="margin-top:0;">Add expense</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <label class="field">
          <span class="lbl">Date</span>
          <input class="input" type="date" id="ef-date">
        </label>
        <label class="field">
          <span class="lbl">Amount</span>
          <input class="input" type="number" id="ef-amount" min="0" step="0.01" placeholder="0.00">
        </label>
      </div>
      <label class="field">
        <span class="lbl">Category</span>
        <select class="input" id="ef-category">
          <option value="groceries">Groceries</option>
          <option value="household">Household</option>
          <option value="medicine">Medicine</option>
          <option value="utilities">Utilities</option>
          <option value="fuel">Fuel &amp; gas</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label class="field">
        <span class="lbl">Note <span class="muted" style="font-family:var(--font-body)">(optional)</span></span>
        <input class="input" id="ef-note" placeholder="e.g. Weekly groceries at Spinneys">
      </label>
      <div style="display:flex; gap:8px;">
        <button class="btn primary" id="ef-save" style="background:var(--indigo); border-color:var(--indigo); color:#0E1330;">Save</button>
        <button class="btn" id="ef-cancel">Cancel</button>
        <button class="btn danger hidden" id="ef-delete" style="margin-left:auto;">Delete expense</button>
      </div>
    </div>

    <div class="section-title">This month by category</div>
    <div class="panel" id="category-breakdown-mount"></div>

    <div class="page-head" style="margin-top:34px; margin-bottom:14px;">
      <div class="section-title" style="margin:0;">History</div>
      <select class="input" id="exp-filter" style="width:auto;">
        <option value="all">All categories</option>
        <option value="groceries">Groceries</option>
        <option value="household">Household</option>
        <option value="medicine">Medicine</option>
        <option value="utilities">Utilities</option>
        <option value="fuel">Fuel &amp; gas</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div id="expense-list-mount"></div>

  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/sheets-sync.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/expenses.js"></script>
</body>
</html>
